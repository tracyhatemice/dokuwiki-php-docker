name: Build DokuWiki PHP-FPM and Apache images

on:
  schedule:
    # Daily at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      php_tag:
        description: 'PHP base image tag for dokuwiki-php-fpm (e.g. 8.5-fpm, 8.4-fpm)'
        default: '8.5-fpm'
        required: true
      force:
        description: 'Build & push even if base images unchanged'
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'php-fpm/**'
      - 'apache/**'
      - '.github/workflows/build-images.yml'

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: dokuwiki-php-fpm
            context: php-fpm
            base: php
            base_tag: ${{ inputs.php_tag || '8.5-fpm' }}
            tag_arg: PHP_TAG
            version_cmd: php -r 'echo PHP_VERSION;'
          - image: dokuwiki-apache
            context: apache
            base: httpd
            base_tag: '2.4'
            tag_arg: HTTPD_TAG
            version_cmd: httpd -v | sed -n 's|.*Apache/\([0-9.]*\).*|\1|p'
    env:
      IMAGE_NAME: ${{ github.repository_owner }}/${{ matrix.image }}
      BASE_IMAGE: ${{ matrix.base }}:${{ matrix.base_tag }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve latest base image digest
        id: base
        run: |
          set -euo pipefail
          BASE_DIGEST=$(docker buildx imagetools inspect "${BASE_IMAGE}" \
            --format '{{json .Manifest}}' | jq -r '.digest')
          echo "Base ${BASE_IMAGE} digest: ${BASE_DIGEST}"
          echo "digest=${BASE_DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Decide whether build is needed
        id: decide
        env:
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          NEW_BASE: ${{ steps.base.outputs.digest }}
          EVENT: ${{ github.event_name }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          if [ "${EVENT}" != "schedule" ] || [ "${FORCE}" = "true" ]; then
            echo "Trigger=${EVENT} force=${FORCE}: build."
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Schedule trigger: skip if previous build used the same base digest.
          if ! docker pull "${IMAGE_REF}" >/dev/null 2>&1; then
            echo "No previous :latest in registry; building."
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          PREV=$(docker inspect "${IMAGE_REF}" \
            --format '{{ index .Config.Labels "org.opencontainers.image.base.digest" }}' \
            2>/dev/null || true)
          echo "Previous base digest: ${PREV:-<none>}"
          echo "Current  base digest: ${NEW_BASE}"
          if [ -n "${PREV}" ] && [ "${PREV}" = "${NEW_BASE}" ]; then
            echo "Base unchanged; skipping rebuild."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve version from base image
        if: steps.decide.outputs.skip != 'true'
        id: ver
        env:
          VERSION_CMD: ${{ matrix.version_cmd }}
        run: |
          set -euo pipefail
          VERSION=$(docker run --rm "${BASE_IMAGE}" sh -c "${VERSION_CMD}")
          [ -n "${VERSION}" ] || { echo "Could not determine version from ${BASE_IMAGE}"; exit 1; }
          DATE=$(date -u +%Y%m%d)
          echo "Version: ${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "date=${DATE}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        if: steps.decide.outputs.skip != 'true'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          pull: true
          provenance: false
          build-args: |
            ${{ matrix.tag_arg }}=${{ matrix.base_tag }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.ver.outputs.version }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.ver.outputs.date }}
            org.opencontainers.image.base.name=docker.io/library/${{ env.BASE_IMAGE }}
            org.opencontainers.image.base.digest=${{ steps.base.outputs.digest }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - name: Summary
        run: |
          if [ "${{ steps.decide.outputs.skip }}" = "true" ]; then
            {
              echo "### ${{ matrix.image }}: no rebuild"
              echo "Base image \`${BASE_IMAGE}\` digest unchanged (\`${{ steps.base.outputs.digest }}\`)."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### ${{ matrix.image }}: built & pushed"
              echo ""
              echo "- \`${REGISTRY}/${IMAGE_NAME}:latest\`"
              echo "- \`${REGISTRY}/${IMAGE_NAME}:${{ steps.ver.outputs.version }}\`"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
