name: Build DokuWiki PHP-FPM and Apache images

on:
  schedule:
    # Daily at 00:00 UTC
    - cron: '0 0 * * *'
    # Weekly, Sunday 04:00 UTC: full rebuild without cache, picks up Debian package updates
    - cron: '0 4 * * 0'
  workflow_dispatch:
    inputs:
      force:
        description: 'Build & push even if base images unchanged'
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'php-fpm/**'
      - 'apache/**'
      - '.github/workflows/build-images.yml'

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # PHP is built from source on Debian; the version comes from the Dockerfile pin
          - image: dokuwiki-php-fpm
            context: php-fpm
            base: debian
            base_tag: trixie-slim
            build_args: ''
            pin_file: php-fpm/Dockerfile
            version_cmd: scripts/php-pin.sh get php-fpm/Dockerfile
          - image: dokuwiki-apache
            context: apache
            base: httpd
            base_tag: '2.4'
            build_args: HTTPD_TAG=2.4
            pin_file: ''
            version_cmd: docker run --rm "$BASE_IMAGE" httpd -v | sed -n 's|.*Apache/\([0-9.]*\).*|\1|p'
    env:
      IMAGE_NAME: ${{ github.repository_owner }}/${{ matrix.image }}
      BASE_IMAGE: ${{ matrix.base }}:${{ matrix.base_tag }}

    steps:
      - uses: actions/checkout@v7

      - name: Check PHP pin
        run: |
          set -euo pipefail
          scripts/php-pin.sh check Dockerfile php-fpm/Dockerfile
          diff -r --exclude=docker-php-entrypoint --exclude=apache2-foreground docker-php php-fpm/docker-php

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve latest base image digest
        id: base
        run: |
          set -euo pipefail
          BASE_DIGEST=$(docker buildx imagetools inspect "${BASE_IMAGE}" \
            --format '{{json .Manifest}}' | jq -r '.digest')
          echo "Base ${BASE_IMAGE} digest: ${BASE_DIGEST}"
          echo "digest=${BASE_DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Decide whether build is needed
        id: decide
        env:
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          NEW_BASE: ${{ steps.base.outputs.digest }}
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          FORCE: ${{ inputs.force }}
          PIN_FILE: ${{ matrix.pin_file }}
        run: scripts/decide-build.sh

      - name: Resolve image version
        if: steps.decide.outputs.skip != 'true'
        id: ver
        env:
          VERSION_CMD: ${{ matrix.version_cmd }}
        run: |
          set -euo pipefail
          VERSION=$(bash -c "${VERSION_CMD}")
          [ -n "${VERSION}" ] || { echo "Could not determine version for ${{ matrix.image }}"; exit 1; }
          DATE=$(date -u +%Y%m%d)
          echo "Version: ${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "date=${DATE}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        if: steps.decide.outputs.skip != 'true'
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          push: true
          pull: true
          no-cache: ${{ steps.decide.outputs.no_cache == 'true' }}
          provenance: false
          build-args: ${{ matrix.build_args }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.ver.outputs.version }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.ver.outputs.date }}
            org.opencontainers.image.base.name=docker.io/library/${{ env.BASE_IMAGE }}
            org.opencontainers.image.base.digest=${{ steps.base.outputs.digest }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - name: Summary
        run: |
          if [ "${{ steps.decide.outputs.skip }}" = "true" ]; then
            {
              echo "### ${{ matrix.image }}: no rebuild"
              echo "Base image \`${BASE_IMAGE}\` digest unchanged (\`${{ steps.base.outputs.digest }}\`)."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### ${{ matrix.image }}: built & pushed"
              echo ""
              echo "- \`${REGISTRY}/${IMAGE_NAME}:latest\`"
              echo "- \`${REGISTRY}/${IMAGE_NAME}:${{ steps.ver.outputs.version }}\`"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
