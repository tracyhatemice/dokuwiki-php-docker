name: Build PHP-Apache image

on:
  schedule:
    # Daily at 00:00 UTC
    - cron: '0 0 * * *'
    # Weekly, Sunday 04:00 UTC: full rebuild without cache, picks up Debian package updates
    - cron: '0 4 * * 0'
  workflow_dispatch:
    inputs:
      force:
        description: 'Build & push even if base image unchanged'
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - 'docker-php/**'
      - '.github/workflows/build-image.yml'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  BASE_IMAGE: debian:trixie-slim

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - name: Check PHP pin
        run: |
          set -euo pipefail
          scripts/php-pin.sh check Dockerfile php-fpm/Dockerfile
          diff -r --exclude=docker-php-entrypoint --exclude=apache2-foreground docker-php php-fpm/docker-php

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve latest base image digest
        id: base
        run: |
          set -euo pipefail
          BASE_DIGEST=$(docker buildx imagetools inspect "${BASE_IMAGE}" \
            --format '{{json .Manifest}}' | jq -r '.digest')
          echo "Base ${BASE_IMAGE} digest: ${BASE_DIGEST}"
          echo "digest=${BASE_DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Decide whether build is needed
        id: decide
        env:
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          NEW_BASE: ${{ steps.base.outputs.digest }}
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          FORCE: ${{ inputs.force }}
          PIN_FILE: Dockerfile
        run: scripts/decide-build.sh

      - name: Resolve PHP version from the Dockerfile pin
        if: steps.decide.outputs.skip != 'true'
        id: phpver
        run: |
          set -euo pipefail
          VERSION=$(scripts/php-pin.sh get Dockerfile)
          DATE=$(date -u +%Y%m%d)
          echo "PHP version: ${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "date=${DATE}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        if: steps.decide.outputs.skip != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          pull: true
          no-cache: ${{ steps.decide.outputs.no_cache == 'true' }}
          provenance: false
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.phpver.outputs.version }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.phpver.outputs.date }}
            org.opencontainers.image.base.name=docker.io/library/${{ env.BASE_IMAGE }}
            org.opencontainers.image.base.digest=${{ steps.base.outputs.digest }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          if [ "${{ steps.decide.outputs.skip }}" = "true" ]; then
            {
              echo "### No rebuild"
              echo "Base image \`${BASE_IMAGE}\` digest unchanged (\`${{ steps.base.outputs.digest }}\`)."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### Built & pushed"
              echo ""
              echo "- \`${REGISTRY}/${IMAGE_NAME}:latest\`"
              echo "- \`${REGISTRY}/${IMAGE_NAME}:${{ steps.phpver.outputs.version }}\`"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
