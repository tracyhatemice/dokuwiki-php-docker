# DokuWiki served by Apache (event MPM); PHP runs in the PHP-FPM container,
# reached through a Unix socket on a shared volume

ServerName localhost
# Runtime files in /tmp, so a read-only container only needs a tmpfs there
PidFile /tmp/httpd.pid
DefaultRuntimeDir /tmp
ServerTokens Prod
ServerSignature Off
TraceEnable Off

# Behind a reverse proxy (e.g. Traefik): use the client IP from X-Forwarded-For when the
# request comes from a trusted proxy, and tell PHP the original request was HTTPS
RemoteIPHeader X-Forwarded-For
RemoteIPInternalProxy ${APACHE_TRUSTED_PROXIES}
SetEnvIf X-Forwarded-Proto "^https$" HTTPS=on

# Hide version control directories (git checkouts of DokuWiki and plugins)
RedirectMatch 404 /\.(git|svn|hg)

DocumentRoot "/var/www/html"
DirectoryIndex disabled
DirectoryIndex index.php index.html

<Directory "/var/www/html">
    Options -Indexes +FollowSymLinks
    # DokuWiki and its plugins protect their directories with .htaccess files
    AllowOverride All
    Require all granted
    # Pass the Authorization header to PHP (DokuWiki API tokens)
    CGIPassAuth On
</Directory>

# Directories DokuWiki protects with its own .htaccess files, enforced here too so they stay
# protected if those files are missing. <DirectoryMatch> applies after .htaccess files,
# so a plugin's .htaccess cannot re-open these. DokuWiki may sit in the document root or
# one directory below it.
<DirectoryMatch "^/var/www/html/([^/]+/)?(bin|conf|data|inc|vendor)/">
    Require all denied
</DirectoryMatch>

# Files hidden by DokuWiki's .htaccess.dist, plus the installer (unused once installed)
<Files ~ "^([\._]ht|README$|VERSION$|COPYING$|install\.php$)">
    Require all denied
</Files>

# Test suites of DokuWiki and its plugins (_test/, tests/, test/), most shipped unprotected;
# DokuWiki's own _test/ bundles PHPUnit and other dev tools under _test/vendor/
<DirectoryMatch "^/var/www/html/(.+/)?(_test|tests?)/">
    Require all denied
</DirectoryMatch>

# PHP libraries bundled by plugins and templates are never requested directly; their
# JavaScript and CSS stay reachable.
<DirectoryMatch "^/var/www/html/([^/]+/)?lib/(plugins|tpl)/[^/]+/vendor/">
    <Files "*.php">
        Require all denied
    </Files>
</DirectoryMatch>

# Hand existing .php files to PHP-FPM
<FilesMatch "\.php$">
    <If "-f %{REQUEST_FILENAME}">
        SetHandler "proxy:unix:/run/php-fpm/php-fpm.sock|fcgi://localhost"
    </If>
</FilesMatch>
# Longer than PHP-FPM's request_terminate_timeout (60s), so PHP-FPM ends slow requests first
ProxyTimeout 90

<IfModule mod_headers.c>
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    # "add", not "set": keeps DokuWiki's own stricter policy on media (fetch.php) intact
    Header always add Content-Security-Policy "frame-ancestors 'self'"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always unset X-Powered-By
</IfModule>
